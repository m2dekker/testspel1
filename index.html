<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Signal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>the signal</h1>
    <nav>
      <button id="sound" class="link">sound: off</button>
      <button id="restart" class="link">restart</button>
    </nav>
  </header>

  <main>
    <section id="log-col">
      <div id="log" aria-live="polite"></div>
    </section>

    <section id="panels">
      <div class="panel" id="p-shack">
        <h2>the shack</h2>
        <div class="btns" id="btns-shack"></div>
      </div>

      <div class="panel hidden" id="p-radio">
        <h2>the radio</h2>
        <div class="readout">
          <span id="freq">90.0</span><small>MHz</small>
          <span id="meter"></span>
        </div>
        <div class="tune">
          <button data-tune="-1" aria-label="tune down 1.0">«</button>
          <button data-tune="-0.1" aria-label="tune down 0.1">‹</button>
          <input type="range" id="dial" min="87.5" max="108" step="0.1" value="90" aria-label="frequency">
          <button data-tune="0.1" aria-label="tune up 0.1">›</button>
          <button data-tune="1" aria-label="tune up 1.0">»</button>
        </div>
        <div id="speaker"></div>
        <div class="power"><span>power</span><span id="power-bar"></span></div>
      </div>

      <div class="panel hidden" id="p-stores">
        <h2>stores</h2>
        <div id="stores"></div>
      </div>

      <div class="panel hidden" id="p-contacts">
        <h2>voices</h2>
        <div id="contacts"></div>
      </div>

      <div class="panel hidden" id="p-camp">
        <h2>the camp</h2>
        <div id="camp"></div>
        <h3>build</h3>
        <div class="btns" id="btns-build"></div>
      </div>
    </section>
  </main>

  <div id="ending" class="overlay hidden">
    <div class="card" id="ending-card"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
